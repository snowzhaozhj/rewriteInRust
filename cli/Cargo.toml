[workspace]
members = ["crates/core", "crates/cli"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/snowzhaozhj/rewriteInRust"

[workspace.dependencies]
# 图引擎
petgraph = "0.6"
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite"] }

# AST 解析
tree-sitter = "0.22"
tree-sitter-typescript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go = "0.21"

# 代码统计
tokei = "12"

# CLI
clap = { version = "4", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

# 配置解析
# 注：曾在册 `jsonschema`（声称供 `validate state` / `validate config` 做 JSON Schema
# 校验），但从未被任何源码引用——两条命令的校验实为手写判据（状态机约束 + 字段合理性），
# 且 serde 的类型化反序列化已覆盖 schema 能管的字段类型/required/枚举层。见 MDR-021。
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# 哈希
sha2 = "0.10"

# 子进程超时
wait-timeout = "0.2"

# 测试
insta = { version = "1", features = ["json"] }
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
strip = true
